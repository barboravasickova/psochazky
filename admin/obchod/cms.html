<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>E-shop | Administrace Psocházky</title>
    <link rel="stylesheet" href="/admin/admin-ui.css" />
    <link href="/admin/obchod/config.yml" type="text/yaml" rel="cms-config-url" />
    <script>
      if (localStorage.getItem("psochazky-cms-obchod-guide-dismissed") === "1") {
        document.documentElement.classList.add("cms-guide-dismissed");
      }
      localStorage.setItem("cms.preview-visible", "false");
    </script>
  </head>
  <body class="admin-cms-body">
    <p class="admin-cms-back">
      <a href="/admin/obchod/index.html">← Zpět na obchod v administraci</a>
    </p>
    <aside class="admin-cms-guide" id="cms-guide">
      <strong>E-shop – jak publikovat</strong>
      <ol>
        <li>V levém menu klikni na <strong>Zobrazit produkty</strong>.</li>
        <li>Rozbal produkt, uprav ho, nebo přidej nový v seznamu.</li>
        <li>Klikni <strong>Publikovat na web</strong>.</li>
      </ol>
      <p class="admin-cms-guide__note">
        Nadpis a úvod obchodu mění správce webu. Doprava a platby jsou nastavené pevně.
      </p>
      <button type="button" class="admin-cms-guide__dismiss" id="cms-guide-dismiss" aria-label="Skrýt nápovědu">
        Rozumím
      </button>
    </aside>
    <script src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"></script>
    <script src="/admin/cms-locale-cs.js"></script>
    <script>
      (function () {
        var guide = document.getElementById("cms-guide");
        var dismiss = document.getElementById("cms-guide-dismiss");
        if (!guide || !dismiss) return;
        dismiss.addEventListener("click", function () {
          document.documentElement.classList.add("cms-guide-dismissed");
          localStorage.setItem("psochazky-cms-obchod-guide-dismissed", "1");
        });
      })();
    </script>
  </body>
</html>
