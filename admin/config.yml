backend:
  name: github
  repo: barboravasickova/psochazky
  branch: main
  base_url: https://netlify-cms-github-oauth-provider-bay.vercel.app
  auth_endpoint: auth

site_url: https://psochazky.cz
display_url: https://psochazky.cz
logo_url: /images/logo-psochazky.svg
locale: cs

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "web_content"
    label: "Texty webu"
    files:
      - label: "Úvodní stránka"
        name: "home_content"
        file: "data/home-content.json"
        format: "json"
        fields:
          - { label: "Hero nadpis", name: "heroTitle", widget: "string" }
          - { label: "Hero popis", name: "heroDescription", widget: "text" }
          - { label: "Hero tlačítko", name: "heroButtonText", widget: "string" }
          - { label: "Manifest nadpis", name: "manifestTitle", widget: "string" }
          - { label: "Manifest text", name: "manifestText", widget: "text" }
          - { label: "Manifest tlačítko", name: "manifestButtonText", widget: "string" }
          - { label: "Nadpis služeb", name: "servicesTitle", widget: "string" }
          - label: "Karty služeb"
            name: "servicesCards"
            widget: "list"
            fields:
              - { label: "Nadpis", name: "title", widget: "string" }
              - { label: "Popis", name: "text", widget: "text" }
              - { label: "Text tlačítka", name: "buttonText", widget: "string" }
          - { label: "Citace", name: "quoteText", widget: "text" }
          - { label: "Podpis u citace", name: "quoteSignature", widget: "text" }
          - { label: "Nadpis Pro koho", name: "forWhomTitle", widget: "string" }
          - label: "Body Pro koho"
            name: "forWhomItems"
            widget: "list"
            field: { label: "Bod", name: "item", widget: "string" }
          - { label: "Tlačítko Pro koho", name: "forWhomButtonText", widget: "string" }
          - { label: "Spodní text úvodu", name: "bottomText", widget: "text" }

      - label: "O mně"
        name: "about_content"
        file: "data/o-mne-content.json"
        format: "json"
        fields:
          - label: "Bloky stránky"
            name: "blocks"
            widget: "list"
            types:
              - label: "Nadpis H1"
                name: "h1"
                widget: "object"
                fields:
                  - { label: "Text", name: "text", widget: "string" }
              - label: "Odstavec"
                name: "p"
                widget: "object"
                fields:
                  - { label: "Text", name: "text", widget: "text" }
                  - { label: "CSS třída (volitelné)", name: "className", widget: "string", required: false }
              - label: "Úvodní box (odstavce)"
                name: "article_intro"
                widget: "object"
                fields:
                  - label: "Odstavce"
                    name: "paragraphs"
                    widget: "list"
                    field: { label: "Odstavec", name: "text", widget: "text" }
              - label: "Obrázek"
                name: "figure"
                widget: "object"
                fields:
                  - { label: "Cesta k souboru", name: "src", widget: "string" }
                  - { label: "Alt text", name: "alt", widget: "string" }
              - label: "Oddělovač"
                name: "hr"
                widget: "object"
                fields:
                  - { label: "Typ", name: "_divider", widget: "hidden", default: "hr" }
              - label: "Nadpis H2"
                name: "h2"
                widget: "object"
                fields:
                  - { label: "Text", name: "text", widget: "string" }
                  - { label: "HTML id (volitelné)", name: "id", widget: "string", required: false }
              - label: "Odrážkový seznam"
                name: "ul"
                widget: "object"
                fields:
                  - label: "Položky"
                    name: "items"
                    widget: "list"
                    field: { label: "Text", name: "item", widget: "string" }
              - label: "Citace (bublina)"
                name: "quote_bubble"
                widget: "object"
                fields:
                  - { label: "Text (nový řádek = zalomení)", name: "text", widget: "text" }
              - label: "CTA tlačítka"
                name: "cta"
                widget: "object"
                fields:
                  - label: "Tlačítka"
                    name: "buttons"
                    widget: "list"
                    fields:
                      - { label: "Text", name: "text", widget: "string" }
                      - { label: "Odkaz", name: "href", widget: "string" }
                      - { label: "Externí odkaz", name: "external", widget: "boolean", default: false }

      - label: "Ceník"
        name: "pricing_content"
        file: "data/cenik-content.json"
        format: "json"
        fields:
          - label: "Bloky stránky"
            name: "blocks"
            widget: "list"
            types:
              - label: "Nadpis H1"
                name: "h1"
                widget: "object"
                fields:
                  - { label: "Text", name: "text", widget: "string" }
              - label: "Úvod ceníku (řádky)"
                name: "cenik_intro"
                widget: "object"
                fields:
                  - label: "Řádky"
                    name: "lines"
                    widget: "list"
                    field: { label: "Řádek", name: "line", widget: "string" }
              - label: "Sekce ceníku"
                name: "cenik_section"
                widget: "object"
                fields:
                  - { label: "ARIA labelledby (id nadpisu)", name: "ariaLabelledBy", widget: "string", required: false }
                  - { label: "Extra třída sekce", name: "sectionClass", widget: "string", required: false }
                  - label: "Obsah sekce"
                    name: "blocks"
                    widget: "list"
                    types:
                      - label: "Nadpis H2"
                        name: "h2"
                        widget: "object"
                        fields:
                          - { label: "Text", name: "text", widget: "string" }
                          - { label: "HTML id (volitelné)", name: "id", widget: "string", required: false }
                      - label: "Nadpis H3"
                        name: "h3"
                        widget: "object"
                        fields:
                          - { label: "Text", name: "text", widget: "string" }
                          - { label: "CSS třída (volitelné)", name: "className", widget: "string", required: false }
                      - label: "Oddělovač"
                        name: "hr"
                        widget: "object"
                        fields:
                          - { label: "Typ", name: "_divider", widget: "hidden", default: "hr" }
                      - label: "Mřížka cen"
                        name: "price_grid"
                        widget: "object"
                        fields:
                          - { label: "Layout", name: "layout", widget: "select", options: ["two", "solo"], default: "two" }
                          - label: "Položky"
                            name: "items"
                            widget: "list"
                            fields:
                              - { label: "Název", name: "title", widget: "string" }
                              - { label: "Částka", name: "amount", widget: "string" }
                              - { label: "Přípona jednotky", name: "unitSuffix", widget: "string", required: false }
                              - { label: "Meta", name: "meta", widget: "string", required: false }
                              - { label: "Varianta", name: "variant", widget: "select", options: ["full", "compact", "solo"], default: "full" }
                              - label: "Odstavce pod cenou"
                                name: "bodyLines"
                                widget: "list"
                                field: { label: "Řádek", name: "line", widget: "string" }
                      - label: "Citace (ceník)"
                        name: "quote_bubble_cenik"
                        widget: "object"
                        fields:
                          - { label: "Text (nový řádek = zalomení)", name: "text", widget: "text" }
                      - label: "Souvislý text"
                        name: "prose"
                        widget: "object"
                        fields:
                          - { label: "Text", name: "text", widget: "text" }
                      - label: "Info box"
                        name: "info_box"
                        widget: "object"
                        fields:
                          - { label: "Tučný nadpis", name: "title", widget: "string" }
                          - { label: "Text", name: "body", widget: "text" }
                      - label: "Platby BOOQITO"
                        name: "payments"
                        widget: "object"
                        fields:
                          - { label: "Úvodní odstavec", name: "intro", widget: "text" }
                          - { label: "Tučný řádek (po úvodu)", name: "afterIntroBold", widget: "string" }
                          - label: "Položky seznamu"
                            name: "listItems"
                            widget: "list"
                            field: { label: "Bod", name: "item", widget: "string" }
                          - { label: "Poznámka dole", name: "note", widget: "string" }
              - label: "Oddělovač"
                name: "hr"
                widget: "object"
                fields:
                  - { label: "Typ", name: "_divider", widget: "hidden", default: "hr" }
              - label: "CTA tlačítka"
                name: "cta"
                widget: "object"
                fields:
                  - label: "Tlačítka"
                    name: "buttons"
                    widget: "list"
                    fields:
                      - { label: "Text", name: "text", widget: "string" }
                      - { label: "Odkaz", name: "href", widget: "string" }
                      - { label: "Externí odkaz", name: "external", widget: "boolean", default: false }

      - label: "Další služby"
        name: "extra_services_content"
        file: "data/dalsi-sluzby-content.json"
        format: "json"
        fields:
          - { label: "Nadpis stránky", name: "title", widget: "string" }
          - { label: "Podnadpis", name: "lead", widget: "string" }
          - { label: "Nadpis Individuální tréninky", name: "section1Title", widget: "string" }
          - { label: "Nadpis S čím pracujeme", name: "section2Title", widget: "string" }
          - { label: "Nadpis Jak probíhají", name: "section3Title", widget: "string" }
          - { label: "Nadpis Výlety", name: "section4Title", widget: "string" }
          - { label: "Nadpis Proč fungují", name: "section5Title", widget: "string" }
          - { label: "Nadpis Pro koho to je", name: "section6Title", widget: "string" }

      - label: "Jak to funguje"
        name: "how_it_works_content"
        file: "data/jak-to-funguje-content.json"
        format: "json"
        fields:
          - { label: "Nadpis stránky", name: "title", widget: "string" }
          - { label: "Úvodní věta", name: "intro", widget: "text" }
          - { label: "Nadpis 1", name: "section1Title", widget: "string" }
          - { label: "Nadpis 2", name: "section2Title", widget: "string" }
          - { label: "Nadpis 3", name: "section3Title", widget: "string" }
          - { label: "Nadpis 4", name: "section4Title", widget: "string" }
          - { label: "Nadpis 5", name: "section5Title", widget: "string" }
          - { label: "Nadpis 6", name: "section6Title", widget: "string" }
          - { label: "Nadpis 7", name: "section7Title", widget: "string" }

      - label: "Kontakt"
        name: "contact_content"
        file: "data/kontakt-content.json"
        format: "json"
        fields:
          - label: "Bloky stránky"
            name: "blocks"
            widget: "list"
            types:
              - label: "Nadpis H1"
                name: "h1"
                widget: "object"
                fields:
                  - { label: "Text", name: "text", widget: "string" }
              - label: "Odstavec"
                name: "p"
                widget: "object"
                fields:
                  - { label: "Text", name: "text", widget: "text" }
                  - { label: "CSS třída (volitelné)", name: "className", widget: "string", required: false }
              - label: "Kontaktní řádky (ikony)"
                name: "contact_list"
                widget: "object"
                fields:
                  - label: "Řádky"
                    name: "rows"
                    widget: "list"
                    fields:
                      - { label: "Typ", name: "kind", widget: "select", options: ["messenger", "email", "location"] }
                      - { label: "URL (Messenger / mailto)", name: "href", widget: "string", required: false }
                      - { label: "Text odkazu", name: "linkLabel", widget: "string", required: false }
                      - { label: "Text za odkazem", name: "suffix", widget: "string", required: false }
                      - { label: "Čistý text (lokalita)", name: "text", widget: "string", required: false }
              - label: "Nadpis H2"
                name: "h2"
                widget: "object"
                fields:
                  - { label: "Text", name: "text", widget: "string" }
                  - { label: "HTML id (volitelné)", name: "id", widget: "string", required: false }
              - label: "Markdown (odstavce, odkazy)"
                name: "markdown"
                widget: "object"
                fields:
                  - { label: "Markdown", name: "body", widget: "text" }
              - label: "Odrážkový seznam"
                name: "ul"
                widget: "object"
                fields:
                  - label: "Položky"
                    name: "items"
                    widget: "list"
                    field: { label: "Text", name: "item", widget: "string" }

      - label: "O webu"
        name: "about_site_content"
        file: "data/o-webu-content.json"
        format: "json"
        fields:
          - { label: "Nadpis stránky", name: "title", widget: "string" }
          - { label: "Nadpis 1. blok", name: "firstHeading", widget: "string" }
          - { label: "Text 1. blok", name: "firstText", widget: "text" }
          - { label: "Nadpis 2. blok", name: "secondHeading", widget: "string" }
          - { label: "Text 2. blok", name: "secondText", widget: "text" }
          - { label: "Text tlačítka zpět", name: "backButtonText", widget: "string" }

  - name: "blog_data"
    label: "Blog příspěvky"
    files:
      - label: "Příspěvky"
        name: "posts"
        file: "data/blog-posts.json"
        format: "json"
        fields:
          - label: "Příspěvky"
            name: "posts"
            widget: "list"
            summary: "{{fields.title}} ({{fields.date}})"
            fields:
              - { label: "Slug", name: "slug", widget: "string", hint: "Například jak-se-pripravit-na-prochazku" }
              - { label: "Titulek", name: "title", widget: "string" }
              - { label: "Datum", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false, picker_utc: false }
              - { label: "Perex", name: "excerpt", widget: "text" }
              - { label: "Obrázek", name: "image", widget: "image", required: false }
              - label: "Obsah (odstavce)"
                name: "content"
                widget: "list"
                field:
                  {
                    label: "Odstavec / nadpis",
                    name: "paragraph",
                    widget: "text",
                    hint: "Pro podnadpis v článku začni řádek ## nebo ### (mezera za křížky)."
                  }
              - { label: "Publikováno", name: "published", widget: "boolean", default: true }
